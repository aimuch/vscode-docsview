<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" fill="none">
  <defs>
    <!-- Rich macOS-style squircle background gradient -->
    <linearGradient id="bg" x1="20" y1="12" x2="236" y2="246" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="48%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(68 42) rotate(48) scale(170)">
      <stop offset="0%" stop-color="#93C5FD" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#93C5FD" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="128" y1="10" x2="128" y2="246" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.42"/>
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.35"/>
    </linearGradient>

    <!-- Multi-format accent cards -->
    <linearGradient id="sheetGreen" x1="40" y1="56" x2="132" y2="188" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="slideAmber" x1="124" y1="56" x2="216" y2="188" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <linearGradient id="docPaper" x1="128" y1="40" x2="128" y2="204" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
    <linearGradient id="lensBg" x1="146" y1="142" x2="206" y2="208" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>

    <filter id="cardShadow" x="36" y="28" width="184" height="202" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="10" stdDeviation="9" flood-color="#09132C" flood-opacity="0.36"/>
    </filter>
    <filter id="badgeShadow" x="122" y="124" width="112" height="112" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#09132C" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Squircle App Base (transparent outside corners) -->
  <rect x="10" y="10" width="236" height="236" rx="54" fill="url(#bg)"/>
  <rect x="10" y="10" width="236" height="236" rx="54" fill="url(#glow)"/>
  <rect x="11" y="11" width="234" height="234" rx="53" stroke="url(#rim)" stroke-width="2"/>

  <!-- Left tilted emerald spreadsheet card -->
  <g transform="rotate(-11 99 125)">
    <rect x="39" y="55" width="104" height="134" rx="18" fill="url(#sheetGreen)"/>
    <path d="M55 89h44M55 111h44M55 133h44M77 73v76" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Right tilted amber presentation/PDF card -->
  <g transform="rotate(11 151 125)">
    <rect x="107" y="55" width="104" height="134" rx="18" fill="url(#slideAmber)"/>
    <rect x="153" y="79" width="40" height="28" rx="6" fill="#FFFFFF" fill-opacity="0.42"/>
    <path d="M159 123h32M159 141h24" stroke="#FFFFFF" stroke-opacity="0.48" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Center hero white document sheet -->
  <g filter="url(#cardShadow)">
    <rect x="61" y="38" width="128" height="160" rx="20" fill="url(#docPaper)"/>
  </g>

  <!-- Crisp content blocks inside the hero document -->
  <rect x="81" y="62" width="66" height="13" rx="6.5" fill="#1D4ED8"/>

  <!-- Mini image/chart preview tile + side text lines -->
  <rect x="81" y="88" width="42" height="42" rx="9" fill="#DBEAFE"/>
  <circle cx="94" cy="101" r="4.5" fill="#2563EB"/>
  <path d="M86 123l11-12 8 8 7-6 6 10H86z" fill="#3B82F6"/>

  <rect x="133" y="92" width="36" height="10" rx="5" fill="#64748B"/>
  <rect x="133" y="112" width="26" height="10" rx="5" fill="#94A3B8"/>

  <!-- Document body lines -->
  <rect x="81" y="144" width="76" height="10" rx="5" fill="#94A3B8"/>
  <rect x="81" y="164" width="48" height="10" rx="5" fill="#CBD5E1"/>

  <!-- Signature "View" Glass Eye Badge on bottom-right -->
  <g filter="url(#badgeShadow)">
    <circle cx="176" cy="175" r="38" fill="#FFFFFF"/>
    <circle cx="176" cy="175" r="32.5" fill="url(#lensBg)"/>
    <!-- Crisp Eye silhouette -->
    <path d="M151.5 175c4.8-9.6 13.6-15 24.5-15s19.7 5.4 24.5 15c-4.8 9.6-13.6 15-24.5 15s-19.7-5.4-24.5-15z" fill="#FFFFFF"/>
    <circle cx="176" cy="175" r="9.5" fill="#1D4ED8"/>
    <circle cx="176" cy="175" r="4.5" fill="#38BDF8"/>
    <circle cx="179.5" cy="171.5" r="2.3" fill="#FFFFFF"/>
  </g>
</svg>
