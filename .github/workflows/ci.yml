name: CI

# Every push to main: type check, unit tests, smoke tests in a real VS Code, then a
# GitHub Release with the offline installer (.vsix). Pull requests run the same checks
# and keep the .vsix as a build artifact, without releasing.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a main build halfway through releasing; superseded PR runs can go.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: 24

jobs:
  build:
    name: Build, test, package
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      vsix: ${{ steps.package.outputs.vsix }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Set build version
        id: version
        run: node scripts/ci-version.mjs ${{ github.run_number }}

      - name: Package .vsix
        id: package
        run: |
          name="docsview-${{ steps.version.outputs.version }}.vsix"
          npx vsce package --no-dependencies --out "$name"
          echo "vsix=$name" >> "$GITHUB_OUTPUT"
          ls -l "$name"

      - uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: ${{ steps.package.outputs.vsix }}
          if-no-files-found: error

  smoke:
    name: Smoke tests (real VS Code)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      # Downloads VS Code (stable) and runs test/smoke inside it, on a virtual display.
      - name: Run smoke tests
        run: xvfb-run -a npm run smoke

  release:
    name: Release
    needs: [build, smoke]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history and tags, for the "changes since the last release" notes.
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          name: vsix

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          VSIX: ${{ needs.build.outputs.vsix }}
        run: |
          tag="v$VERSION"
          node scripts/release-notes.mjs "$VERSION" "$VSIX" > notes.md
          if gh release view "$tag" > /dev/null 2>&1; then
            # A re-run of the same build: refresh the installer instead of failing.
            gh release upload "$tag" "$VSIX" --clobber
          else
            gh release create "$tag" "$VSIX" \
              --target "$GITHUB_SHA" \
              --title "DocsView $VERSION" \
              --notes-file notes.md \
              --latest
          fi
